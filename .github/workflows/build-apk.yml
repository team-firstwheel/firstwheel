name: build-release-apk

# GitHub에서 release APK를 자동으로 빌드한다.
# Actions 탭 → build-release-apk → Run workflow 로 실행한 뒤, 실행 결과의 Artifacts에서 APK를 내려받는다.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: 알고리즘 테스트
        run: gradle :core:test
      - name: release APK 빌드
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
